# 참가·탈퇴 이슈 → docs/members.json 갱신 (scripts/join.mjs)
#
# 이슈는 누구나 연다. 그래서 이슈 제목·본문을 ${{ }} 로 run: 에 끼워 넣지 않는다(셸 주입 방지) —
# 스크립트가 이벤트 파일(GITHUB_EVENT_PATH)에서 직접 읽는다.
#
# 되먹임이 없는 이유: GITHUB_TOKEN 으로 한 push·댓글·닫기는 새 워크플로 실행을 만들지 않는다
# (GitHub 규칙). 게다가 이 워크플로는 issues 의 opened/edited/reopened 만 듣는다 —
# 봇의 댓글(issue_comment)·닫기(closed)·push 는 여기에 해당하지 않는다.
#
# 같은 까닭으로 GITHUB_TOKEN 으로 한 push 는 GitHub Pages 빌드도 일으키지 않는다(Pages 문서).
# 그래서 scripts/join.mjs 가 push 뒤에 POST /repos/<repo>/pages/builds 로 빌드를 직접 부탁한다
# (pages: write). 사이트는 "브랜치에서 배포(main 의 /docs)"로 켜 둔다는 가정이다.
name: join

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write   # docs/members.json 커밋·push
  issues: write     # 결과 댓글, 성공 시 닫기
  pages: write      # 명단을 바꾼 뒤 Pages 다시 빌드 부탁(GITHUB_TOKEN push 로는 빌드가 안 돈다)

# 명단을 고치는 실행은 한 번에 하나씩. queue: max 는 기다리는 실행을 최대 100개까지 줄 세운다
# (없으면 기다리던 실행이 새로 온 실행에 밀려 취소된다 — 여럿이 동시에 참가하면 신청이 묻힌다).
# 그래도 겹치면 scripts/join.mjs 가 push 거절을 보고 최신 명단으로 다시 한다.
concurrency:
  group: token-meter-members
  cancel-in-progress: false
  queue: max

jobs:
  members:
    # 닫힌 이슈를 고친 경우는 건너뛴다(스크립트도 최신 상태를 다시 읽어 한 번 더 거른다)
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 참가·탈퇴 처리
        run: node scripts/join.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
